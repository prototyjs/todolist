<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<title>Todo App</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">

	<!-- Шапка: Квадратик с крестиком, инпут и лейбел -->
	<header class="app-header">
		<div class="search-row">
			<div class="color-square">✕</div>
			<input class="search-input">
		</div>

		<div class="labels-row">
			<div class="label">Code</div>
			<div class="label">Anime</div>
			<div class="label">Document</div>
			<div class="label">Anime</div>
			<div class="label">Document</div>
			<div class="label">Code</div>
		</div>
	</header>

	<!-- Список задач -->
	<main class="task-list">
		<!-- Оборачиваем задачку в кнопки -->
		<div class="task-swipe-wrapper">

			<!-- Левые кнопки -->
			<div class="task-actions task-actions-left">
				<button class="action-btn">Blank</button>
				<button class="action-btn">Progress</button>
				<button class="action-btn">Done</button>
			</div>

			<div class="task-card" tabindex="0" autofocus>
				<div class="task-title">Сверстать всех на верх</div>
				<div class="task-description">
					<span class="category-tag">Code</span>
					<span class="task-date">Date Time</span>
				</div>
			</div>

			<!-- Правые кнопки -->
			<div class="task-actions task-actions-right">
				<button class="action-btn">Pin</button>
				<button class="action-btn">Remove</button>
			</div>

		</div>

		<!-- Оборачиваем задачку в кнопки -->
		<div class="task-swipe-wrapper">

			<!-- Левые кнопки -->
			<div class="task-actions task-actions-left">
				<button class="action-btn">Blank</button>
				<button class="action-btn">Progress</button>
				<button class="action-btn">Done</button>
			</div>

		<div class="task-card" tabindex="0" autofocus>
			<div class="task-title">Запланировать новое аниме на киновечер</div>
			<div class="task-description">
				<span class="category-tag">Anime</span>
				<span class="task-date">Date Time</span>
			</div>
		</div>

			<!-- Правые кнопки -->
		<div class="task-actions task-actions-right">
			<button class="action-btn">Pin</button>
			<button class="action-btn">Remove</button>
		</div>

		</div>

	</main>

	<!-- Нижнее меню -->
	<nav class="bottom-nav">
		<button class="nav-settings">Settings</button>
		<button class="nav-item-add">+</button>
		<button class="nav-calendar">Calendar</button>
	</nav>

</div>
<script type="module" src="/main.js"></script>
</body>
</html>
