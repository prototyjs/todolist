<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<style>
    body {
        width: 320px;
        margin: 20px;
    }
    .calendar-wrapper {
        position: relative;
        width: 100%;
        background: #fff;
        overflow: hidden;
        font-family: sans-serif;
        h3 {
            margin: 0 0 2em 0;
            text-align: center;
        }
    }

    .calendar-weekdays {
        position: absolute;
        width: 100%;
        margin-top: 2.3em;
        display: grid;
        font-size: 14px;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
        text-align: center;
        font-weight: bold;
    }

    .calendar-viewport {
        width: 100%;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;
        -ms-overflow-style: none;
        scrollbar-width: none;
        overflow-anchor: auto;
    }

    .calendar-viewport::-webkit-scrollbar {
        display: none;
    }

    .calendar-track {
        display: flex;
    }

    .calendar-month {
        flex: 0 0 100%;
        scroll-snap-align: start;
        box-sizing: border-box;
    }

    .calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
        text-align: center;
    }
    .is-today {
        outline: 1px solid gray;
    }
    .is-selected {
        background-color: #3fcd6b;
    }
</style>

<div class="calendar-wrapper">
    <div :each="weekdays" class="calendar-weekdays">
        <span :text="item"></span>
    </div>
    <div class="calendar-viewport" el="viewport">
        <div :each.once="monthsData" class="calendar-track" scope="month">
            <div class="calendar-month">
                <h3 :text="month.title"></h3>
                <div :each.once="month.cells" class="calendar-grid" scope="day">
                <span
                        :text="day.value"
                        :class="{
                    'is-today': isToday(month.year, month.monthIndex, day.value),
                    'is-selected': isSelected(month.year, month.monthIndex, day.value)
                  }"
                        :onclick="selectDate(month.year, month.monthIndex, day.value)"
                ></span>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="module">
	import { prototy } from '../../../prototy.js'

	const today = new Date()
	const currentYear = today.getFullYear()
	const START_YEAR = currentYear - 1
	const END_YEAR = currentYear + 1

	const monthFormat = new Intl.DateTimeFormat('en-En', { month: 'long' })
	const weekdayFormat = new Intl.DateTimeFormat('en-En', { weekday: 'short' })

	const app = prototy({
		root: document.body,
		state: { selectedDate: 0 },
		params: {
			weekdays: (() => {
				const base = new Date(1970, 0, 5)
				return Array.from({ length: 7 }, (_, i) => {
					const d = new Date(base)
					d.setDate(base.getDate() + i)
					const name = weekdayFormat.format(d)
					return name.charAt(0).toUpperCase() + name.slice(1)
				})
			})(),
			monthsData: (() => {
				const list = []
				for (let y = START_YEAR; y <= END_YEAR; y++) {
					for (let m = 0; m < 12; m++) {
						const date = new Date(y, m, 1)
						const rawName = monthFormat.format(date)
						const totalDays = new Date(y, m + 1, 0).getDate()
						const offset = date.getDay() === 0 ? 6 : date.getDay() - 1
						const cells = []
						for (let i = 0; i < offset; i++) {
							cells.push({ value: '' })
						}
						for (let d = 1; d <= totalDays; d++) {
							cells.push({ value: d })
						}
						list.push({
							id: `${y}-${m}`,
							year: y,
							monthIndex: m,
							title: `${rawName.charAt(0).toUpperCase() + rawName.slice(1)} ${y}`,
							cells: cells
						})
					}
				}
				return list
			})(),
		},
		methods: {
			isToday:(y, m, d) => y === today.getFullYear() && m === today.getMonth() && d === today.getDate(),
			isSelected(y, m, d) {
				const s = this.state.selectedDate
				return s && y === s.getFullYear() && m === s.getMonth() && d === s.getDate()
			},
			selectDate(y, m, d) {
				this.state.selectedDate = new Date(y, m, d)
			}
		},
		ready() {
			const w = this.els.viewport.clientWidth
			const currentMonthIndex = (today.getFullYear() - START_YEAR) * 12 + today.getMonth()
			this.els.viewport.scrollTo({ left: w * currentMonthIndex, behavior: 'instant' })
		}
	})

</script>
</body>
</html>
