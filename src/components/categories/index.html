<template component="menu">
    <ul :hidden="item?.id === 'inbox'">
        <li :hidden="item?.id === 'general'">
            <button :onclick="rename()">
                <sprite-icon name="rename"></sprite-icon><span>Rename</span>
            </button>
        </li>
        <li>
            <button :onclick="move()" :disabled="item?.count === 0" :hidden="typeof item?.count !== 'number'">
                <sprite-icon name="move"></sprite-icon><span>Move Tasks</span>
            </button>
        </li>
        <li :hidden="item?.id === 'general'" class="dangerous">
            <button :onclick="item.count ? remove() : deleteEmpty()"
                    :disabled="item?.categories?.length > 0">
                <sprite-icon name="remove"></sprite-icon><span :text="item?.categories ? 'Remove empty' : 'Remove'">Remove</span>
            </button>
        </li>
    </ul>
</template>

<template component="field">
    <div class="title" :text="item.text" :display="!isCurrentRenaming(item.id)"></div>
    <div class="wrapper-field outline" display-else>
        <input type="text" :onblur="save(item, event)" maxlength="20" :class="{ active: isCurrentRenaming(item.id) }">
        <div class="cancel-rename"  :onpointerdown.prevent.stop="el.previousElementSibling.value = ''"><sprite-icon name="destroy"></sprite-icon></div>
    </div>
</template>

<div class="screen-top-bar">
    <button class="outline" :onclick="isMoving ? cancel() : close()" :text="isMoving ? 'Cancel' : 'Close'"></button>
    <h4><sprite-icon name="catalog"></sprite-icon>Categories</h4>
    <button class="outline" :onclick="move()" :hidden="!isMoving" :disabled="!activeItem">Move to…</button>
</div>
<div class="content" :class="{ moving: isMoving, renaming: isRenaming }">
    <ul :each="folders" class="folders" scope="folder">
        <li class="folder-item">
            <div class="folder" :onclick="handleMenu(event, 'folder', folder)" :class="{ outline: isCurrent(folder.id) }">
                <div class="content">
                    <sprite-icon :name="folderIndex ? (folderIndex === folders.length-1 ? 'plus' : 'folder') : 'inbox'"></sprite-icon>
                    <div :component="components.field" :props="{ item: folder }"></div>
                    <sprite-icon :name="!isMoving && folder.id === 'inbox' && 'lock'"></sprite-icon>
                </div>
                <div :component="!isRenaming && isCurrent(folder.id) && components.menu" class="actions" :props="{ item: folder }"></div>
            </div>
            <ul :each="folder.categories" class="categories" scope="category">
                <li class="category-item" :onclick="handleMenu(event, 'category', category, folder)"
                    :class="{ outline: isCurrent(category.id), self: isMoving && targetCategory && (category.id == targetCategory?.id) }">
                    <div class="content">
                        <sprite-icon :name="!categoryIndex && !folderIndex ? 'general' : categoryIndex === folder?.categories.length-1 ? 'plus' : 'category' "></sprite-icon>
                        <div :component="components.field" :props="{ item: category }"></div>
                        <div class="wrapper-count">
                            <span :text="category.count" :hidden="typeof category.count !== 'number'"></span>
                            <span :text="'+' + targetCategory?.count" :hidden="!isMoving || !isCurrent(category.id)" class="added"></span>
                        </div>
                        <sprite-icon :name="category.id == targetCategory?.id ? (isDeleting && 'remove') : ((isDeleting || isMoving) && 'checked_line')"></sprite-icon>
                    </div>
                    <div :component="!isRenaming && isCurrent(category.id) && components.menu" class="actions" :props="{ item:category }"></div>
                </li>
            </ul>
        </li>
    </ul>
</div>
