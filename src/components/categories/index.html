<template component="menu">
    <ul :hidden="item?.id === 'inbox'">
        <li :hidden="item?.id === 'general'">
            <button :onclick="rename()" cy="menu-rename">
                <sprite-icon name="rename"></sprite-icon><span>Rename</span>
            </button>
        </li>
        <li>
            <button :onclick.stop="move()" :disabled="item?.count === 0" :hidden="typeof item?.count !== 'number'" cy="menu-move">
                <sprite-icon name="move"></sprite-icon><span>Move Tasks</span>
            </button>
        </li>
        <li :hidden="item?.id === 'general'" class="dangerous">
            <button :onclick="remove()" cy="menu-remove"
                    :disabled="item?.categories?.length > 1">
                <sprite-icon name="remove"></sprite-icon><span :text="item?.categories ? 'Remove empty' : 'Remove'">Remove</span>
            </button>
        </li>
    </ul>
</template>

<template component="field">
    <div class="title" :text="item.title" :display="!(isCurrent(item.id) && isRenaming)"></div>
    <div class="wrapper-field outline" display-else>
        <input type="text" :onblur="renameCategory(item, event)" maxlength="20" class="active" :el="input.target = isCurrent(item.id) && isRenaming && el" cy="rename-input">
        <div class="cancel-rename"  :onpointerdown.prevent.stop="input.target.value = ''"><sprite-icon name="destroy" cy="rename-cancel"></sprite-icon></div>
    </div>
</template>

<div class="screen-top-bar">
    <button class="outline" :onclick="isMoving ? cancel() : close()" :text="isMoving ? 'Cancel' : 'Close'" cy="close"></button>
    <h4><sprite-icon name="catalog"></sprite-icon>Categories</h4>
    <button class="outline" :onclick="moveCategory()" :hidden="!isMoving" :disabled="!current">Move to…</button>
</div>
<div class="content" :class="{ moving: isMoving, renaming: isRenaming }">
    <ul :each="folders" class="folders" scope="folder">
        <li class="folder-item" :hidden="!folder.id && folders.length > limit">

            <div class="folder" :onclick="handleMenu(event, 'folder', folder)" :cy="folder.role === 'addFolder' ? 'addFolder' : null" :class="{ outline: isCurrent(folder.id) }">
                <div class="content">
                    <sprite-icon :name="getUI(folder, 'icon')"></sprite-icon>
                    <div :component="components.field" :props="{ item: folder }"></div>

                    <span class="count-folder"
                          :text="`${folder.categories?.length - 1} of ${limit}`"
                          :hidden="!getUI(folder, 'hasCount')">
                    </span>
                </div>
                <div :component="!isRenaming && isCurrent(folder.id) && components.menu" class="actions" :props="{ item: folder }"></div>
            </div>

            <ul :each="folder.categories" class="categories" scope="category">
                <li class="category-item"
                    :onclick="handleMenu(event, 'category', category, folder)"
                    :cy="category.role === 'addCategory' ? 'addCategory' : null"
                    :class="{ outline: isCurrent(category.id), self: isMoving && target && (category.id == target?.id) }"
                    :hidden="!category.id && folder?.categories.length > limit">

                    <div class="content">
                        <sprite-icon :name="getUI(category, 'icon')"></sprite-icon>
                        <div :component="components.field" :props="{ item: category }"></div>

                        <div class="wrapper-count" :hidden="!getUI(category, 'hasCount')">
                            <span :text="category.count" :hidden="typeof category.count !== 'number'"></span>
                            <span :text="'+' + target?.count" :hidden="!isMoving || !isCurrent(category.id)" class="added"></span>
                        </div>
                        <sprite-icon :name="actionIcon(category)"></sprite-icon>
                    </div>
                    <div :component="!isRenaming && isCurrent(category.id) && components.menu" class="actions" :props="{ item: category }"></div>
                </li>
            </ul>
        </li>
    </ul>
</div>
