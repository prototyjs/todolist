<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<title>Todo App</title>
	<link rel="stylesheet" href="style.css">
	<script src="script.js" defer></script>
</head>
<body>

<div class="app-container">

	<!-- Шапка: Квадратик с крестиком, инпут и лейбел -->
	<header class="app-header">
		<div class="search-row">
			<div class="color-square">✕</div>
			<input class="search-input">
		</div>

		<div class="labels-row">
			<div class="label">Code</div>
			<div class="label">Anime</div>
			<div class="label">Document</div>
			<div class="label">Anime</div>
			<div class="label">Document</div>
			<div class="label">Code</div>
		</div>
	</header>

	<!-- Список задач -->
	<main class="task-list">
		<div>

			<div class="task-card">
				<div class="task-title">Сверстать всех на верх</div>
				<div class="task-description">
					<span class="category-tag">Code</span>
					<span class="task-date">Date Time</span>
				</div>
			</div>
		</div>

		<div class="task-card">
			<div class="task-title">Запланировать новое аниме на киновечер</div>
			<div class="task-description">
				<span class="category-tag">Anime</span>
				<span class="task-date">Date Time</span>
			</div>
		</div>

	</main>

	<!-- Нижнее меню -->
	<nav class="bottom-nav">
		<button class="nav-settings">Settings</button>
		<button class="nav-item-add">+</button>
		<button class="nav-calendar">Calendar</button>
	</nav>

</div>

</body>
</html>
